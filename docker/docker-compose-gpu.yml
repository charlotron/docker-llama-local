name: claude-llama-gpu

services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    container_name: llama-cpp-gpu
    ports:
      - "${LLAMA_PORT:-12345}:${LLAMA_PORT:-12345}"
    volumes:
      - ./data/models:/models
    command: >
      --server
      --model /models/${HF_FILE}
      --alias claude_local
      --host 0.0.0.0 
      --port ${LLAMA_PORT:-12345}
      --n-gpu-layers ${LLAMA_GPU_LAYERS:-all}
      --ctx-size ${LLAMA_CONTEXT_SIZE:-32768}
      --context-shift
      --batch-size 512 
      --ubatch-size 256
      --threads ${LLAMA_CPU_THREADS:-16} 
      --threads-batch ${LLAMA_CPU_THREADS:-16} 
      --fit on
      --flash-attn on 
      --cache-type-k q8_0 
      --cache-type-v q8_0 
      --no-mmap
      --jinja
      --reasoning on
      --temp 0.75 
      --top-p 0.95 
      --top-k 40 
      --min-p 0.05 
      --repeat-penalty 1.00
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
