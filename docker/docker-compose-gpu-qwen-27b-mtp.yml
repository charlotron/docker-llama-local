# =================================================================
# DOCKER COMPOSE CONFIGURATION - GPU (CUDA), QWEN 27B DENSE MODE
# =================================================================
# Alternate profile: a dense (non-MoE) 27B model instead of the 35B A3B MoE.
# Best verified config on this hardware (RTX 4070 SUPER 12GB / 23GB WSL RAM):
# IQ4_XS quant + MTP (--spec-type draft-mtp --spec-draft-n-max 2) at
# --parallel 3 -- 5.4 tok/s, confirmed swap-free via 5s-interval `free -h`
# polling through a full benchmark run. See docs/BENCHMARKS.md and
# BENCHMARK_RESULTS.md (row 12) for full evidence.
#
# IMPORTANT CAVEAT: this is still far slower than the 35B A3B MoE profile
# (42 tok/s) or gpt-oss-20b (42 tok/s) -- this profile exists for cases that
# specifically need a dense (all-params-active) model, not as a speed pick.
# A 27B dense model is compute-bound on this hardware (confirmed: smaller
# and larger quants were all tried and none broke ~5-6 tok/s -- see
# docs/BENCHMARKS.md "27B dense: every lever tried"). Bigger K-quants
# (Q4_K_XL, Q5_K_M) measure slower, not faster -- do not "upgrade" the quant
# expecting better throughput.
#
# ROUND 12 UPDATE -- reliability over speed, by explicit request. Thinking mode
# stays ON (preserve_thinking:true below) and --predict stays at 81920. Re-ran
# the exact Round 5 LRU-cache-with-TTL prompt end to end against this profile
# as committed: it completed cleanly inside budget (31998/81920 total tokens,
# finish_reason=stop, MTP draft acceptance 0.687) and the generated code passed
# its own demo AND all 10 independent edge-case tests with ZERO fixes needed --
# it did NOT reproduce the Round 5 "burns the whole budget in reasoning" failure
# from back when --predict was only 4000-8000. Wall-clock: ~141 minutes (8468s)
# at ~4-5.8 tok/s -- budget 2-2.5 hours for a hard coding task on this profile.
# Added --reasoning-budget/--reasoning-budget-message below as a belt-and-
# suspenders safety net so a future harder prompt can never repeat the old
# failure mode even if it tries to reason far longer than this one did.
#
# Two other levers were tried this round and explicitly rejected, see
# docs/BENCHMARK_RESULTS.md Round 12 for full detail:
# - External draft-model speculative decoding (--spec-type draft-simple -md
#   <small-model>): loads, but fails cleanly at init ("the target and draft
#   vocabs are not compatible") with Qwen3-0.6B-GGUF as drafter -- this 27B's
#   tokenizer/vocab does not match the generic small Qwen3 GGUFs. No
#   vocab-compatible small sibling was found for this specific 27B repo. Not a
#   config problem to "fix" -- same class of hard incompatibility as the
#   dflash/ngram no-ops already documented for this model.
# - Sampling tweaks for "more efficient" reasoning: no such Qwen-documented
#   control exists beyond enabling/disabling thinking outright (ruled out by
#   the user) -- temp/top_p/top_k are creativity knobs, not budget knobs.

name: docker-llama-gpu

services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda

    container_name: llama-cpp-gpu-qwen-27b-mtp

    # Restrict container memory usage to protect host system stability
    mem_limit: 24g

    ports:
      - "${LLAMA_PORT:-12345}:${LLAMA_PORT:-12345}"

    volumes:
      - ${MODELS_DIR:-./docker/data/models}:/models

    command:
      # --- Basic Server Setup ---
      - "--server"
      - "--model"
      - "/models/${TARGET_MODEL_FILE:-Qwen3.8-27B-UD-IQ4_XS.gguf}"
      - "--alias"
      - "llama-local"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${LLAMA_PORT:-12345}"

      # --- Prompt & Chat Templates ---
      - "--jinja"
      - "--chat-template-kwargs"
      - '{"preserve_thinking": true, "default_system_prompt": "You are a helpful coding assistant. RESPOND ALWAYS IN SPANISH."}'

      # --- VRAM & Memory Allocation ---
      - "--fit-target"
      - "1536"

      # --- Context & Attention Options ---
      # Same 393216 / 3 = 131072 (128K) per-slot split as the 35B A3B profile.
      - "--ctx-size"
      - "393216"
      # Raised from 32768 per Qwen's own guidance (up to 81920 for complex coding/
      # math tasks) -- only a cap, not a forced length; still stops at EOS.
      - "--predict"
      - "81920"
      # Surgical reasoning-budget safety net (Round 12): caps the THINKING
      # channel specifically, separate from --predict's cap on the whole
      # response. Set to leave a guaranteed ~16K tokens for the visible
      # answer even in the worst case, instead of relying purely on the
      # model choosing to stop reasoning on its own. Not needed for the
      # Round 12 LRU-cache task (it used ~27.6K reasoning tokens, well under
      # this cap) but protects against a harder future prompt reasoning much
      # longer. --reasoning-budget-message injects a closing nudge into the
      # reasoning trace when the budget is hit, so the model is pushed to
      # actually answer instead of being cut off mid-thought.
      - "--reasoning-budget"
      - "65536"
      - "--reasoning-budget-message"
      - "Time is nearly up. Stop reasoning now and write the final answer using what you have concluded so far."
      - "--flash-attn"
      - "on"
      - "--context-shift"

      # --- Concurrency & Cache Optimization ---
      # 393216 / 2 = 196608 (192K) per slot -- fewer concurrent slots, more context each.
      - "--parallel"
      - "2"
      - "--cache-type-k"
      - "q4_0"
      - "--cache-type-v"
      - "q4_0"
      - "--cache-ram"
      - "2048"

      # --- Performance & Speed Optimization ---
      # NOTE: "none", not "mlock" -- mlock hangs indefinitely (uninterruptible D-state
      # disk wait) when the model sits on a slow/virtualized filesystem (e.g. a WSL2
      # /mnt/<drive> 9p mount, ~15MB/s measured). See docs/VISION_MODEL_EVAL.md.
      - "--load-mode"
      - "none"
      - "--no-warmup"
      # Multi-Token Prediction speculative decoding. Verified swap-free at
      # --parallel 3 with the IQ4_XS quant above (smaller quant leaves enough
      # RAM headroom); a larger quant like Q5_K_M pushed this host into swap
      # at the same parallel level and made things SLOWER, not faster -- see
      # docs/BENCHMARKS.md before changing TARGET_MODEL_FILE to a bigger quant.
      - "--spec-type"
      - "draft-mtp"
      - "--spec-draft-n-max"
      - "2"

      # --- CPU Thread Tuning ---
      - "--threads"
      - "${LLAMA_CPU_THREADS:-14}"
      - "--threads-batch"
      - "${LLAMA_CPU_THREADS:-14}"

      # --- Sampling & Anti-Loop Parameters ---
      # temp/top_p/top_k/min_p/presence_penalty/repeat_penalty follow Qwen3.6-27B's
      # official "thinking mode for precise coding tasks" preset (preserve_thinking:
      # true above), chosen for reliability over creativity per user request. Source:
      # huggingface.co/Qwen/Qwen3.6-27B model card.
      - "--temp"
      - "0.6"
      - "--top-p"
      - "0.95"
      - "--top-k"
      - "20"
      - "--min-p"
      - "0"
      - "--presence-penalty"
      - "0"
      - "--repeat-penalty"
      - "1.0"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped
