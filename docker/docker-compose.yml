services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp
    ports:
      - "${LLAMA_CPP_PORT:-8133}:8133"
    volumes:
      - ./data:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      PORT: 8133
      CTX: 32768
      MODEL_FILE: ${LLAMA_CPP_HF_FILE:-qwen2.5-coder-14b-instruct-q4_k_m.gguf}
    # Añadimos múltiples alias para cubrir lo que pida la CLI
    command: >
      -m /models/${LLAMA_CPP_HF_FILE} 
      --alias claude-3-5-sonnet-20241022 
      --alias claude-3-5-sonnet-latest 
      --alias claude-3-sonnet-20240229 
      --port 8133 
      -ngl 999 
      -c 32768 
      --cache-type-k q4_0 
      --cache-type-v q4_0 
      --no-mmap 
      --flash-attn on 
      --jinja 
      --host 0.0.0.0
    restart: unless-stopped
