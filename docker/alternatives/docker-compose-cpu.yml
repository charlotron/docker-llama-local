# =================================================================
# DOCKER COMPOSE CONFIGURATION - CPU COMPATIBLE MODE
# =================================================================
name: llama-cpp-qwopus3-5-9b-q4-k-m

services:
  # The main llama.cpp inference service (running on CPU)
  qwopus3-5-9b-q4-k-m:
    # Use the official standard llama.cpp docker image compiled for CPU inference
    image: ghcr.io/ggml-org/llama.cpp:full
    
    # Custom name for the running container
    container_name: llama-cpp-qwopus3.5-9b-q4-k-m
    
    # Expose the configured llama-server port to the host machine
    ports:
      - "${LLAMA_PORT:-12345}:${LLAMA_PORT:-12345}"
      
    # Mount the local models directory into the container's /models folder
    volumes:
      - ${MODELS_DIR:-./docker/data/models}:/models
      
    # Command-line flags passed directly to llama-server
    command:
      # --- Basic Server Setup ---
      # Enable llama-server REST API mode (required for client agents)
      - "--server"
      # Specify the path of the target GGUF model file inside the container
      - "--model"
      - "/models/${TARGET_MODEL_FILE:-Qwopus3.5-9B-v3.Q4_K_M.gguf}"
      # Set the model alias (used as the model name in completions calls)
      - "--alias"
      - "llama-local"
      # Bind to 0.0.0.0 so the server can accept requests from your network
      - "--host"
      - "0.0.0.0"
      # The internal port that llama-server will listen on
      - "--port"
      - "${LLAMA_PORT:-12345}"

      # --- Prompt & Chat Templates ---
      # Enable Jinja template rendering for modern, precise chat formatting
      - "--jinja"
      # Disables thinking blocks to save memory, and forces Spanish system prompt
      - "--chat-template-kwargs"
      - '{"preserve_thinking": false, "default_system_prompt": "You are a helpful coding assistant. RESPOND ALWAYS IN SPANISH."}'

      # --- Context & Attention Options ---
      # Total context window size across all parallel slots.
      # This total size is divided by the number of parallel slots (--parallel) to determine
      # the maximum context size available for each individual client (e.g., 32768 / 1 = 32768 tokens per slot).
      - "--ctx-size"
      - "${LLAMA_CONTEXT_SIZE:-32768}"
      # Limit maximum tokens to generate per single response (prevents CPU bottlenecks)
      - "--predict"
      - "4096"
      # Enable Flash Attention to speed up processing and minimize memory footprint
      - "--flash-attn"
      # Enable context shifting to automatically slide context window on overflow
      - "--context-shift"

      # --- Concurrency & Cache Optimization ---
      # Number of parallel slots/requests (clients) the server can handle simultaneously (set to 1 for CPU mode).
      # Note: The total context size (--ctx-size) is divided among these active slots to get each slot's max context.
      - "--parallel"
      - "1"
      # Quantize key-cache to q4_0 format to save massive RAM.
      # Note: q4_0 is used here to support parallel execution (e.g., calling multiple AI subagents simultaneously).
      # If parallel execution is not needed (single-client mode), you can change this to q8_0 to improve cache precision and context quality.
      - "--cache-type-k"
      - "q4_0"
      # Quantize value-cache to q4_0 format to save massive RAM.
      # Note: q4_0 is used here to support parallel execution (e.g., calling multiple AI subagents simultaneously).
      # If parallel execution is not needed (single-client mode), you can change this to q8_0 to improve cache precision and context quality.
      - "--cache-type-v"
      - "q4_0"

      # --- Performance & Speed Optimization ---
      # Disable mmap memory mapping to ensure entire model fits in RAM actively for faster inference
      - "--no-mmap"

      # --- CPU Thread Tuning ---
      # Number of physical CPU threads for prompt processing
      - "--threads"
      - "${LLAMA_CPU_THREADS:-14}"
      # Number of physical CPU threads for batch generation
      - "--threads-batch"
      - "${LLAMA_CPU_THREADS:-14}"

      # --- Sampling & Anti-Loop Parameters ---
      # Controls creativity (lower values are more deterministic and focused)
      - "--temp"
      - "0.6"
      # Cumulative probability cutoff for nucleus sampling
      - "--top-p"
      - "0.95"
      # Limit vocabulary selection to top K tokens
      - "--top-k"
      - "20"
      # Minimum token probability threshold (filters out low-probability repetitve tokens)
      - "--min-p"
      - "0.05"
      # Penalizes repetition based on presence of tokens in the conversation
      - "--presence-penalty"
      - "0.2"
      # Scale penalty for repeating identical word patterns (breaks infinite loops)
      - "--repeat-penalty"
      - "1.1"

    # Automatically restart the container unless manually stopped
    restart: unless-stopped
